name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (tagged commit)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Verify tag matches plugin.json.version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(jq -r '.version' .claude-plugin/plugin.json)"
          expected="v${version}"
          if [ "$tag" != "$expected" ]; then
            echo "FAIL: tag '$tag' != plugin.json version '$expected'"
            exit 1
          fi

      - name: Manifest validity (.claude-plugin/plugin.json)
        run: |
          set -euo pipefail
          manifest=.claude-plugin/plugin.json
          jq -e '.' "$manifest" >/dev/null
          jq -e '.name == "visual-explainer"' "$manifest" >/dev/null
          jq -e '.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")' "$manifest" >/dev/null
          jq -e '.description != null and (.description | length) > 0' "$manifest" >/dev/null

      - name: SKILL.md frontmatter (name + description present)
        run: |
          set -euo pipefail
          skill=skills/visual-explainer/SKILL.md
          awk 'NR==1 && /^---$/ {f=1; next} f && /^---$/ {exit} f' "$skill" > /tmp/fm.yml
          grep -qE '^name:[[:space:]]*visual-explainer\b' /tmp/fm.yml
          grep -qE '^description:[[:space:]]*' /tmp/fm.yml

      - name: SKILL.md path integrity (references/ + examples/)
        run: |
          set -euo pipefail
          skill_dir=skills/visual-explainer
          skill="$skill_dir/SKILL.md"
          missing=0
          while IFS= read -r relpath; do
            full="$skill_dir/$relpath"
            if [ ! -e "$full" ]; then
              echo "FAIL: referenced file missing: $full"
              missing=$((missing + 1))
            fi
          done < <(grep -oE '(references|examples)/[A-Za-z0-9._/-]+' "$skill" | sort -u)
          [ "$missing" -eq 0 ]

      - name: Build plugin zip (explicit allowlist)
        run: |
          set -euo pipefail
          version="$(jq -r '.version' .claude-plugin/plugin.json)"
          zipname="visual-explainer-plugin-v${version}.zip"
          stage="$(mktemp -d)"
          root="$stage/visual-explainer"
          mkdir -p \
            "$root/.claude-plugin" \
            "$root/skills/visual-explainer/references" \
            "$root/skills/visual-explainer/examples"
          cp .claude-plugin/plugin.json                                    "$root/.claude-plugin/plugin.json"
          cp skills/visual-explainer/SKILL.md                              "$root/skills/visual-explainer/SKILL.md"
          cp skills/visual-explainer/references/design-system.md           "$root/skills/visual-explainer/references/"
          cp skills/visual-explainer/references/visual-snapshot-library.md "$root/skills/visual-explainer/references/"
          cp skills/visual-explainer/references/writing-voice.md           "$root/skills/visual-explainer/references/"
          cp skills/visual-explainer/examples/reference-example.html       "$root/skills/visual-explainer/examples/"
          cp README.md                                                     "$root/README.md"
          cp LICENSE                                                       "$root/LICENSE"
          (cd "$stage" && zip -r "$GITHUB_WORKSPACE/$zipname" visual-explainer)

      - name: Build standalone skill zip (explicit allowlist)
        run: |
          set -euo pipefail
          version="$(jq -r '.version' .claude-plugin/plugin.json)"
          zipname="visual-explainer-skill-v${version}.zip"
          stage="$(mktemp -d)"
          root="$stage/visual-explainer"
          mkdir -p \
            "$root/references" \
            "$root/examples"
          cp skills/visual-explainer/SKILL.md                              "$root/SKILL.md"
          cp skills/visual-explainer/references/design-system.md           "$root/references/"
          cp skills/visual-explainer/references/visual-snapshot-library.md "$root/references/"
          cp skills/visual-explainer/references/writing-voice.md           "$root/references/"
          cp skills/visual-explainer/examples/reference-example.html       "$root/examples/"
          (cd "$stage" && zip -r "$GITHUB_WORKSPACE/$zipname" visual-explainer)

      - name: Generate checksums
        run: |
          set -euo pipefail
          sha256sum \
            visual-explainer-plugin-v*.zip \
            visual-explainer-skill-v*.zip \
            > release-assets-sha256.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG:      ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(jq -r '.version' .claude-plugin/plugin.json)"
          plugin_zip="visual-explainer-plugin-v${version}.zip"
          skill_zip="visual-explainer-skill-v${version}.zip"
          notes_file="$(mktemp)"
          cat > "$notes_file" <<EOF
          ## Assets

          - \`${plugin_zip}\` — full plugin bundle with the standalone skill included.
          - \`${skill_zip}\` — standalone skill bundle for \`~/.claude/skills/\`.
          - \`release-assets-sha256.txt\` — SHA256 checksums for all attached zip assets.

          ## SHA256

          \`\`\`
          $(cat release-assets-sha256.txt)
          \`\`\`
          EOF
          gh release create "$TAG" \
            "$plugin_zip" \
            "$skill_zip" \
            "release-assets-sha256.txt" \
            --title "visual-explainer ${TAG}" \
            --notes-file "$notes_file"
