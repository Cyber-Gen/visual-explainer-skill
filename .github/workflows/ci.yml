name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Manifest validity (.claude-plugin/plugin.json)
        run: |
          set -euo pipefail
          manifest=.claude-plugin/plugin.json
          test -f "$manifest" || { echo "FAIL: $manifest missing"; exit 1; }
          jq -e '.' "$manifest" >/dev/null
          jq -e '.name == "visual-explainer"' "$manifest" >/dev/null \
            || { echo "FAIL: name must be \"visual-explainer\""; exit 1; }
          jq -e '.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")' "$manifest" >/dev/null \
            || { echo "FAIL: version must be MAJOR.MINOR.PATCH"; exit 1; }
          jq -e '.description != null and (.description | length) > 0' "$manifest" >/dev/null \
            || { echo "FAIL: description missing or empty"; exit 1; }

      - name: SKILL.md frontmatter + trigger-phrase floor
        run: |
          set -euo pipefail
          skill=skills/visual-explainer/SKILL.md
          test -f "$skill" || { echo "FAIL: $skill missing"; exit 1; }
          awk 'NR==1 && /^---$/ {f=1; next} f && /^---$/ {exit} f' "$skill" > /tmp/fm.yml
          grep -qE '^name:[[:space:]]*visual-explainer\b' /tmp/fm.yml \
            || { echo "FAIL: SKILL.md frontmatter missing 'name: visual-explainer'"; exit 1; }
          grep -qE '^description:' /tmp/fm.yml \
            || { echo "FAIL: SKILL.md frontmatter missing 'description'"; exit 1; }
          description="$(awk '/^description:/{sub(/^description:[[:space:]]*/,""); print; exit}' /tmp/fm.yml)"
          phrases=("explain" "teach" "walk me through" "help me understand" "break down" "visualize" "primer" "field guide" "deep-dive" "visual learner")
          hit=0
          missing=()
          for p in "${phrases[@]}"; do
            if grep -qiF "$p" <<<"$description"; then
              hit=$((hit + 1))
            else
              missing+=("$p")
            fi
          done
          if [ "$hit" -lt 5 ]; then
            echo "FAIL: only $hit canonical trigger phrases in description; need >= 5"
            echo "  missing: ${missing[*]}"
            exit 1
          fi
          echo "OK: $hit/${#phrases[@]} trigger phrases present"

      - name: SKILL.md path integrity (references/ + examples/)
        run: |
          set -euo pipefail
          skill_dir=skills/visual-explainer
          skill="$skill_dir/SKILL.md"
          missing=0
          while IFS= read -r relpath; do
            full="$skill_dir/$relpath"
            if [ ! -e "$full" ]; then
              echo "FAIL: referenced file missing: $full"
              missing=$((missing + 1))
            fi
          done < <(grep -oE '(references|examples)/[A-Za-z0-9._/-]+' "$skill" | sort -u)
          [ "$missing" -eq 0 ]

      - name: Canonical example passes structural checker
        run: |
          ./tests/check_artifact.sh skills/visual-explainer/examples/reference-example.html

      - name: Packaging allowlist files present
        run: |
          set -euo pipefail
          files=(
            ".claude-plugin/plugin.json"
            "skills/visual-explainer/SKILL.md"
            "skills/visual-explainer/references/design-system.md"
            "skills/visual-explainer/references/visual-snapshot-library.md"
            "skills/visual-explainer/references/writing-voice.md"
            "skills/visual-explainer/examples/reference-example.html"
            "README.md"
            "LICENSE"
          )
          missing=0
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "MISS $f"
              missing=$((missing + 1))
            fi
          done
          [ "$missing" -eq 0 ]
